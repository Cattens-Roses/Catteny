[General]
Server/AccessControl/AllowedUsers=admin,teacher1,teacher2
Server/AccessControl/AllowedGroups=org-admins,org-teachers

[Directory]
# Built-in directory (no LDAP needed for small orgs)
Directory/Mode=builtin

[Locations]
Locations/1/Name=Main Office
Locations/1/Computers/1/Name=PC-01
Locations/1/Computers/1/Address=192.168.1.101
Locations/1/Computers/2/Name=PC-02
Locations/1/Computers/2/Address=192.168.1.102

[ACL]
# Group: org-admins (full control)
ACL/1/Name=org-admins
ACL/1/Type=group
ACL/1/Permissions=full
ACL/2/Name=org-teachers
ACL/2/Type=group
ACL/2/Permissions=demo,lock,messages,files
