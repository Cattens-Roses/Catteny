# Allow selecting multiple items
mode: optionalmultiple

# Feed selections into the "packages" module
method: packages

labels:
    step: "Additional Software"

items:
    - id: ""
      name: "None"
      description: "Skip additional software"
      screenshot: ":/images/no-selection.png"

    - id: office
      packages: [libreoffice-fresh, thunderbird]
      name: "Office Suite"
      description: "LibreOffice + Thunderbird"
      screenshot: "images/office.png"

    - id: media
      packages: [vlc, gimp, kdenlive]
      name: "Media Tools"
      description: "VLC, GIMP, Kdenlive"
      screenshot: "images/media.png"

    - id: gaming
      packages: [steam, lutris, heroic]
      name: "Gaming"
      description: "Steam, Lutris, Heroic"
      screenshot: "images/gaming.png"

    - id: dev
      packages: [code, git, firefox, python]
      name: "Development"
      description: "VS Code, Git, Firefox, Python"
      screenshot: "images/dev.png"

    - id: browser
      packages: [firefox, brave]
      name: "Browsers"
      description: "Firefox + Brave"
      screenshot: "images/browser.png"
