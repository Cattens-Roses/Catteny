# Use pacman as the package manager
packageManager: pacman

# Base packages (always installed)
base:
    - base
    - linux-cachyos
    - linux-cachyos-bore
    - linux-firmware
    - intel-ucode
    - grub
    - efibootmgr
    - os-prober
    - networkmanager
    - openssh
    - vim
    - fastfetch
    - plasma
    - sddm

# The packagechooser selections are automatically appended here
# via GlobalStorage — no extra config needed.
