<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="catteny-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#991b1b" />
      <stop offset="45%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#ff3366" />
    </linearGradient>
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#dc2626" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Shield Glow in Pitch Black & Red Border -->
  <circle cx="50" cy="50" r="46" fill="#050508" stroke="url(#catteny-grad)" stroke-width="2.5" />
  <circle cx="50" cy="50" r="42" fill="url(#bg-glow)" />
  
  <!-- Arch Silhouette with Cat Ears in Crimson -->
  <path d="M 50 14 
           L 62 34 
           L 74 22 
           L 70 46 
           C 78 58, 80 72, 76 82 
           C 70 76, 62 74, 50 78 
           C 38 74, 30 76, 24 82 
           C 20 72, 22 58, 30 46 
           L 26 22 
           L 38 34 Z" 
        fill="url(#catteny-grad)" filter="url(#glow)" />
        
  <!-- Inner Details / Eyes -->
  <polygon points="50,32 58,48 42,48" fill="#050508" />
  <circle cx="43" cy="58" r="3" fill="#ffffff" />
  <circle cx="57" cy="58" r="3" fill="#ffffff" />
  <circle cx="44" cy="57" r="1.3" fill="#991b1b" />
  <circle cx="58" cy="57" r="1.3" fill="#991b1b" />

  <!-- Whiskers -->
  <line x1="36" y1="64" x2="25" y2="62" stroke="#ff3366" stroke-width="1.8" stroke-linecap="round" />
  <line x1="36" y1="67" x2="24" y2="68" stroke="#ff3366" stroke-width="1.8" stroke-linecap="round" />
  <line x1="64" y1="64" x2="75" y2="62" stroke="#ff3366" stroke-width="1.8" stroke-linecap="round" />
  <line x1="64" y1="67" x2="76" y2="68" stroke="#ff3366" stroke-width="1.8" stroke-linecap="round" />
</svg>
