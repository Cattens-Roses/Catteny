name: Build ISO

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux
      options: --privileged
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Debug pacman.conf
        run: |
          file profile/pacman.conf
          cat -A profile/pacman.conf | head -5

      - name: Install build deps
        run: |
          pacman -Syyuu --noconfirm
          pacman -Sy --noconfirm archiso squashfs-tools libisoburn dosfstools grub

      - name: Build Veyon package
        run: |
          pacman -S --needed --noconfirm base-devel git python python-pip \
            qt6-base qt6-declarative qt6-svg qt6-tools qt6-translations \
            qt6-5compat qt6-httpserver qca-qt6 libxtst libxrandr libxinerama \
            libxdamage libxkbcommon pipewire libpulse libvncserver \
            libxcomposite libxcursor extra-cmake-modules ninja
          useradd -m -s /bin/bash builder
          # Clone WITH submodules
          git clone --recurse-submodules --depth 1 --branch v4.9.1 \
            https://github.com/veyon/veyon.git /tmp/veyon-src
          cat > /tmp/veyon-src/PKGBUILD << 'EOF'
          pkgname=veyon
          pkgver=4.9.1
          pkgrel=1
          pkgdesc="Open source classroom management software"
          arch=(x86_64)
          url="https://veyon.io"
          license=(GPL-2.0)
          depends=(qt6-base qt6-declarative qt6-svg libxkbcommon pipewire libpulse)
          makedepends=(cmake ninja python)
          source=()
          sha256sums=()
          build() {
            # Fix PIDS_VAL for libproc2 4.x — remove 4th arg from all calls
            find /tmp/veyon-src/plugins -name "*.cpp" -o -name "*.h" | \
              xargs sed -i 's/PIDS_VAL(\([^,]*\), \([^,]*\), \([^,]*\), info)/PIDS_VAL(\1, \2, \3)/g'
            find /tmp/veyon-src -name "CMakeLists.txt" -not -path "*/pkg/*" \
              -exec sed -i 's/-Werror/-Wno-error/g' {} \; 2>/dev/null || true
            find /tmp/veyon-src -name "*.cmake" -not -path "*/pkg/*" \
              -exec sed -i 's/-Werror/-Wno-error/g' {} \; 2>/dev/null || true
            mkdir -p /tmp/veyon-src/build
            cd /tmp/veyon-src/build
            # Fix QAtomicInt::arg() for Qt6 — add .load() to atomic counter args
            # Fix QAtomicInt for Qt6 — cast to int instead of .load()
            sed -i 's/\.arg(m_\([a-zA-Z]*\(Counter\|PerSecond\)\))/.arg((int)m_\1)/g' \
              /tmp/veyon-src/plugins/webapi/WebApiController.cpp
            cmake /tmp/veyon-src \
              -G Ninja \
              -DCMAKE_BUILD_TYPE=Release
            ninja
          }
          package() {
            cd /tmp/veyon-src/build
            DESTDIR="${pkgdir}" ninja install
          }
          EOF
          chown -R builder:builder /tmp/veyon-src
          su -s /bin/bash builder -c "cd /tmp/veyon-src && makepkg -s --noconfirm --cleanbuild"
          cp /tmp/veyon-src/veyon-*.pkg.tar.* /__w/Catteny/Catteny/profile/

      - name: Build Calamares package
        run: |
          pacman -S --needed --noconfirm base-devel git python python-yaml python-jsonschema \
            kcoreaddons kpmcore libpwquality qt6-declarative qt6-svg yaml-cpp \
            extra-cmake-modules libglvnd ninja qt6-tools qt6-translations
          useradd -m -s /bin/bash builder || true
          git clone --depth 1 https://aur.archlinux.org/calamares.git /tmp/calamares-src
          chown -R builder:builder /tmp/calamares-src
          su -s /bin/bash builder -c "cd /tmp/calamares-src && makepkg -s --noconfirm --cleanbuild"
          cp /tmp/calamares-src/calamares-*.pkg.tar.* /__w/Catteny/Catteny/profile/

      - name: Build ISO
        run: mkarchiso -v -w /tmp/build -o ./out ./profile/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: catteny-iso
          path: out/*.iso
          retention-days: 30
